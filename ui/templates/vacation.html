<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">VacationSite</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
<div class="container mt-5">
    <h2 class="text-center mb-4">Vacations List</h2>
    <table class="table table-striped table-bordered text-center align-middle">
        <thead class="table-dark">
        <tr>
            <th> Id </th>
            <th> Country ID</th>
            <th> Description</th>
            <th> Start date</th>
            <th> End date</th>
            <th> Image</th>
            <th> Price </th>
        </tr>
    </thead>
    <tbody>
        {% for v in vacations%}
        <tr>
            <td>{{v.id}}</td>
            <td>{{v.country}}</td>
            <td>{{v.description}}</td>
            <td>{{v.start_date}}</td>
            <td>{{v.end_date}}</td>
            <td> <img src="{{ url_for('static', filename='images/' + v.image) }}" alt="Vacation image" class="img-thumbnail" style="width: 100px;">
            </td>
            <td> {{v.price}}</td>
        </tr>
        {% endfor %}
    </tbody>
    </table>

</body>

</html>
